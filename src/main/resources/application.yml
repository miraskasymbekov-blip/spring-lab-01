spring:
  application:
    name: spring-lab
server:
  port: 8080
app:
  owner: Miras Kassymbekov
  group: IS-2301
  mail:
    from: no-reply@iitu.kz
    retry-count: 3
    timeout: 5s
    enabled: true
  report:
    timezone: Asia/Almaty
    retention: 30d
    include-charts: true
logging:
  level:
    kz.iitu: INFO
management:
  endpoints:
    web:
      exposure:
        include: health,env,configprops,conditions
  endpoint:
    env:
      show-values: always
    configprops:
      show-values: always
