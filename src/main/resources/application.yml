spring:
  application:
    name: spring-lab
  datasource:
    url: jdbc:h2:file:./data/txlab
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
  h2:
    console:
      enabled: true
server:
  port: 8080
app:
  owner: Miras Kassymbekov
  group: IS-2301
  mail:
    from: no-reply@iitu.kz
    retry-count: 3
    timeout: 5s
    enabled: true
  report:
    timezone: Asia/Almaty
    retention: 30d
    include-charts: true
logging:
  level:
    kz.iitu: INFO
    org.springframework.orm.jpa.JpaTransactionManager: DEBUG
management:
  endpoints:
    web:
      exposure:
        include: health,env,configprops,conditions,flyway
  endpoint:
    env:
      show-values: always
    configprops:
      show-values: always
